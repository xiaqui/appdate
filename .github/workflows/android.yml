name: Personal Release Store
on:
  push:
    branches: ['work/startup-refresh-summary', 'fix/android7-wifi-diagnostics']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Preview delivery requires a deliberate [publish-preview] commit or manual dispatch after all gates.
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Successful verify job run ID whose bundle should be reused (source-identical CI-only changes)'
        required: false
        type: string
      full_matrix:
        description: 'Also run Android 11, 12, 13 and 15'
        required: false
        default: false
        type: boolean
      force_device:
        description: 'Run device jobs even when source-identical successful results can be reused'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Select a new build or a source-identical verified bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.reuse_run_id }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          reuse_run_id=
          reuse_branch=$(jq -rn --arg branch "$GITHUB_REF_NAME" '$branch | @uri')
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            reuse_run_id=$REQUESTED_RUN_ID
          elif [[ "$GITHUB_EVENT_NAME" == push ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && \
               git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- app settings.gradle.kts gradle.properties; then
            # CI/release-script-only change: find the newest non-expired bundle
            # whose verify job succeeded. Full identity validation happens in reuse.
            while read -r candidate; do
              [[ "$candidate" == "$GITHUB_RUN_ID" ]] && continue
              jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100")
              jq -e '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length == 1' <<<"$jobs" >/dev/null || continue
              artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts?per_page=100")
              jq -e '[.artifacts[] | select(.name == "verified-preview-bundle" and (.expired | not))] | length == 1' <<<"$artifacts" >/dev/null || continue
              reuse_run_id=$candidate
              break
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=$reuse_branch&status=completed&per_page=100" --jq '.workflow_runs[].id')
          fi
          if [[ -n "$reuse_run_id" ]]; then
            [[ "$reuse_run_id" =~ ^[0-9]+$ ]]
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "reuse_run_id=$reuse_run_id" >> "$GITHUB_OUTPUT"
            echo "Reusing verified bundle from run $reuse_run_id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reuse_run_id=" >> "$GITHUB_OUTPUT"
            echo "No source-identical bundle selected; verify will build once." >> "$GITHUB_STEP_SUMMARY"
          fi
  verify:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build preview
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.STORE_PREVIEW_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PREVIEW_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PREVIEW_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.STORE_PREVIEW_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?missing signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?missing key alias}"
          : "${ANDROID_KEY_PASSWORD:?missing key password}"
          test "$ANDROID_KEY_ALIAS" = xiaqui
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/store-preview.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset KEYSTORE_B64
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK and record build identity
        env:
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature")
          test "$cert" = dcfd2c8122274ec4148473c96b1853989c8d22e58e445d6ec4889ad5b34dffb2
          if [[ -n "$EXPECTED_CERT" ]]; then test "${cert,,}" = "${EXPECTED_CERT,,}"; fi
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" "$RUNNER_TEMP/badging"
          grep -Fx "sdkVersion:'23'" "$RUNNER_TEMP/badging"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -F "package: name='jp.xiaqui.artifact.store.preview'" "$RUNNER_TEMP/badging"
          stat -c '%s bytes' "$apk"
          mkdir -p delivery
          cp "$apk" delivery/ReleaseStore-preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk delivery/ReleaseStore-preview-androidTest.apk
          python3 .github/release/write-bundle-manifest.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 .github/release/validate-bundle.py --require-current-source
          python3 .github/release/device-result-identity.py "$GITHUB_SHA" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-preview-bundle
          path: delivery/
          if-no-files-found: error
          retention-days: 7
  reuse:
    needs: plan
    if: needs.plan.outputs.reuse_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      device_reused: ${{ steps.device_result.outputs.reused }}
      device_run_id: ${{ steps.device_result.outputs.run_id }}
      device_identity: ${{ steps.device_result.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and successful verify job
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ needs.plan.outputs.reuse_run_id }}
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .conclusion \
            | grep -Fx success
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length' \
            | grep -Fx 1
      - uses: actions/download-artifact@v8
        with:
          name: verified-preview-bundle
          path: delivery
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Validate reusable bundle against current application source
        run: python3 .github/release/validate-bundle.py --require-current-source
      - id: device_result
        name: Reuse source-identical successful device results when safe
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ needs.plan.outputs.reuse_run_id }}
          FULL_MATRIX: ${{ inputs.full_matrix == true || contains(github.event.head_commit.message, '[full-matrix]') }}
          FORCE_DEVICE: ${{ inputs.force_device == true }}
        shell: bash
        run: |
          set -euo pipefail
          reused=false
          reason="device results require a fresh run"
          apk_source=$(jq -er .sourceSha delivery/manifest.json)
          apk_digest=$(jq -er .apk.sha256 delivery/manifest.json)
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .head_sha)
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?per_page=100")
          identity=
          if [[ "$FULL_MATRIX" == true ]]; then
            reason="full_matrix requested"
          elif [[ "$FORCE_DEVICE" == true ]]; then
            reason="force_device requested"
          elif [[ "$run_sha" != "$apk_source" ]]; then
            reason="source run head does not match bundle source"
          elif spec=$(python3 .github/release/device-result-identity.py "$apk_source" "$GITHUB_SHA"); then
            identity=$(jq -er .currentIdentity <<<"$spec")
            all_ok=true
            required_apis=(23 29 34)
            if [[ "$GITHUB_REF_NAME" == fix/android7-wifi-diagnostics ]]; then
              required_apis+=(24)
            fi
            for api in "${required_apis[@]}"; do
              jq -e --arg name "device ($api)" \
                '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' \
                <<<"$jobs" >/dev/null || all_ok=false
            done
            if [[ "$all_ok" == true ]]; then
              reused=true
              reason="same APK and device test conditions; all required APIs succeeded in source run"
            else
              reason="source run lacks one or more required device results"
            fi
          else
            reason="device test conditions changed"
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "run_id=$REUSE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          {
            echo "### Device result reuse"
            echo "- Reuse source run: $REUSE_RUN_ID"
            echo "- APK source: $apk_source"
            echo "- APK SHA-256: $apk_digest"
            echo "- Device condition identity: ${identity:-not reusable}"
            echo "- Required API results reused: $reused"
            echo "- Decision: $reason"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-preview-bundle
          path: delivery/
          if-no-files-found: error
          retention-days: 7
  device:
    # Source-identical API 23/29/34 results are reused only after the reuse job verifies their test identity.
    needs: [verify, reuse]
    if: always() && (needs.verify.result == 'success' || needs.reuse.result == 'success') && needs.reuse.outputs.device_reused != 'true'
    strategy:
      fail-fast: false
      matrix:
        # Routine CI covers Android 6, 10, and 14. Broader OS coverage is reserved for release checks.
        api: ${{ fromJSON((inputs.full_matrix == true || contains(github.event.head_commit.message, '[full-matrix]')) && (github.ref_name == 'fix/android7-wifi-diagnostics' && '[23,24,29,30,31,33,34,35]' || '[23,29,30,31,33,34,35]') || (github.ref_name == 'fix/android7-wifi-diagnostics' && '[23,24,29,34]' || '[23,29,34]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: verified-preview-bundle
          path: delivery
      - name: Validate exact verified APK bundle
        run: python3 .github/release/validate-bundle.py --require-current-source
      - name: Fetch verified 0.4.2 update baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.2 --repo "$GITHUB_REPOSITORY" --pattern ReleaseStore-0.4.2.apk --output old-release.apk
          echo 'e98f9cfe9a4f98b9de51cb9329f84fc4e471483dc25af0da9be5d7be0cdc2e32  old-release.apk' | sha256sum -c
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: bash .github/workflows/device-checks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: seven-rows-api-${{ matrix.api }}
          path: seven-rows.png
          retention-days: 7

  preview:
    needs: [verify, reuse, device]
    if: always() && (needs.device.result == 'success' || needs.reuse.outputs.device_reused == 'true') && (needs.verify.result == 'success' || needs.reuse.result == 'success') && (github.ref == 'refs/heads/work/startup-refresh-summary' || github.ref == 'refs/heads/fix/android7-wifi-diagnostics') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: verified-preview-bundle
          path: delivery
      - name: Verify Release Asset and publish the requested preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release/validate-bundle.py --require-current-source
          python3 .github/release/check-published-version.py
          version=$(jq -er .versionName delivery/manifest.json)
          code=$(jq -er .versionCode delivery/manifest.json)
          title="startup refresh summary"
          details="Startup refresh and shared automatic/manual summary."
          if [[ "$GITHUB_REF_NAME" == fix/android7-wifi-diagnostics ]]; then
            test "$version" = 0.9.1
            test "$code" = 18
            title="Android 7 APK download diagnostics"
            details="PR #13 records the active network at Wi-Fi deferral and distinguishes APK API/redirect/body transport failures. On Z4T, install over the existing AppDate, leave automatic Wi-Fi download enabled, relaunch on the affected Wi-Fi, then capture the repository detail result. Compare with an explicit individual APK inspection on the same network."
          fi
          apk_source=$(jq -er .sourceSha delivery/manifest.json)
          export PREVIEW_SOURCE="$GITHUB_SHA"
          apk="delivery/ReleaseStore-v${version}-preview.apk"
          mv delivery/ReleaseStore-preview.apk "$apk"
          export PREVIEW_TAG="store-preview-${PREVIEW_SOURCE:0:12}"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          state=$(python .github/release/check-preview.py)
          if [[ "$state" == absent ]]; then
            gh release create "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --target "$PREVIEW_SOURCE" --draft --prerelease --title "AppDate $version · $title" --notes "$details AppDate $version ($code). APK source: $apk_source. CI workflow head: $GITHUB_SHA. APK SHA-256: $sha. Same fixed xiaqui signing certificate. Device acceptance pending; not for silent installation. Issue #9, pull-to-refresh, naming overhaul and UI redesign are not included."
          fi
          asset=$(basename "$apk")
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG" --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$PREVIEW_TAG" "$apk" -R "$GITHUB_REPOSITORY"
          fi
          manifest_asset="ReleaseStore-v${version}-preview.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG" --jq '.assets[].name' | grep -Fxq "$manifest_asset"; then
            jq --arg name "$asset" '.releaseApkName = $name' delivery/manifest.json > "delivery/$manifest_asset"
            gh release upload "$PREVIEW_TAG" "delivery/$manifest_asset" -R "$GITHUB_REPOSITORY"
          fi
          mkdir -p verify
          gh release download "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --pattern "$asset" --dir verify
          cmp "$apk" "verify/$asset"
          python .github/release/check-preview.py
          gh release edit "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          python .github/release/check-preview.py --published
          echo "APK SHA-256: $sha" >> "$GITHUB_STEP_SUMMARY"
