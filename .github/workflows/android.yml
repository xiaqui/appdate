name: Personal Release Store
on:
  push:
    branches: ['work/auto-update-notify']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Preview delivery requires a deliberate [publish-preview] commit or manual dispatch.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build preview
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.STORE_PREVIEW_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PREVIEW_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.STORE_PREVIEW_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.STORE_PREVIEW_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?missing signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?missing key alias}"
          : "${ANDROID_KEY_PASSWORD:?missing key password}"
          test "$ANDROID_KEY_ALIAS" = xiaqui
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/store-preview.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset KEYSTORE_B64
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK and record build identity
        env:
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature")
          test "$cert" = dcfd2c8122274ec4148473c96b1853989c8d22e58e445d6ec4889ad5b34dffb2
          if [[ -n "$EXPECTED_CERT" ]]; then test "${cert,,}" = "${EXPECTED_CERT,,}"; fi
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" "$RUNNER_TEMP/badging"
          grep -Fx "sdkVersion:'23'" "$RUNNER_TEMP/badging"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -F "package: name='jp.xiaqui.artifact.store.preview' versionCode='13' versionName='0.8.1'" "$RUNNER_TEMP/badging"
          stat -c '%s bytes' "$apk"
          cp "$apk" ReleaseStore-preview.apk
          { echo "$GITHUB_SHA"; sha256sum ReleaseStore-preview.apk; } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject reused or decreasing APK versionCode across published Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          aapt = str(Path(os.environ["ANDROID_HOME"]) / "build-tools/35.0.0/aapt")
          def metadata(path):
              output = subprocess.check_output([aapt, "dump", "badging", str(path)], text=True)
              import re
              match = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'", output, re.M)
              if not match:
                  raise RuntimeError(f"Cannot read APK package metadata: {path}")
              return match.group(1), int(match.group(2)), match.group(3)

          current_id, current_code, current_name = metadata(apk)
          current_hash = hashlib.sha256(apk.read_bytes()).hexdigest()
          repo = os.environ["GITHUB_REPOSITORY"]
          releases = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases?per_page=100"], text=True))
          with tempfile.TemporaryDirectory() as tmp:
              for release in releases:
                  if release.get("draft"):
                      continue
                  for asset in release.get("assets", []):
                      if not asset["name"].lower().endswith(".apk"):
                          continue
                      dest = Path(tmp) / "prior.apk"
                      subprocess.run(
                          ["gh", "release", "download", release["tag_name"],
                           "--repo", repo, "--pattern", asset["name"],
                           "--output", str(dest)], check=True)
                      prior_hash = hashlib.sha256(dest.read_bytes()).hexdigest()
                      prior_id, prior_code, prior_name = metadata(dest)
                      if prior_id != current_id or prior_hash == current_hash:
                          continue
                      if current_code <= prior_code:
                          raise SystemExit(
                              f"Refusing delivery: {current_id} {current_name} "
                              f"(versionCode {current_code}) differs from published "
                              f"{release['tag_name']}/{asset['name']} "
                              f"({prior_name}, versionCode {prior_code}). "
                              "Increment versionCode and versionName before delivery.")
          print(f"Version gate passed: {current_id} {current_name} ({current_code})")
          PY
      - uses: actions/upload-artifact@v7
        with:
          path: ReleaseStore-preview.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
  device:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Physical acceptance covers Android 6-10 and 14. CI fills the Android
        # 11-13 and 15 gaps while retaining the old-device boundaries.
        api: [23, 29, 30, 31, 33, 34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v8
        with:
          name: ReleaseStore-preview.apk
          path: delivery
          skip-decompress: true
      - name: Fetch verified 0.4.2 update baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.2 --repo "$GITHUB_REPOSITORY" --pattern ReleaseStore-0.4.2.apk --output old-release.apk
          echo 'e98f9cfe9a4f98b9de51cb9329f84fc4e471483dc25af0da9be5d7be0cdc2e32  old-release.apk' | sha256sum -c
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: bash .github/workflows/device-checks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: seven-rows-api-${{ matrix.api }}
          path: seven-rows.png
          retention-days: 7

  preview:
    needs: [verify, device]
    if: github.ref == 'refs/heads/work/auto-update-notify' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: ReleaseStore-preview.apk
          path: delivery
          skip-decompress: true
      - name: Verify Release Asset and publish automatic-update preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=delivery/ReleaseStore-v0.8.1-preview.apk
          mv delivery/ReleaseStore-preview.apk "$apk"
          export PREVIEW_TAG="store-preview-${GITHUB_SHA:0:12}"
          export PREVIEW_SOURCE="$GITHUB_SHA"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          state=$(python .github/release/check-preview.py)
          if [[ "$state" == absent ]]; then
            gh release create "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'AppDate 0.8.1 · automatic updates' --notes "PR #6 automatic-update preview 0.8.1 (13), including Issue #8 independent switches. Source: $GITHUB_SHA. APK SHA-256: $sha. Same fixed xiaqui signing certificate. Device acceptance pending; not for silent installation. Issue #9, pull-to-refresh, naming overhaul and UI redesign are not included."
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIEW_TAG" --jq '.assets[].name' | grep -Fxq ReleaseStore-v0.8.1-preview.apk; then
            gh release upload "$PREVIEW_TAG" "$apk" -R "$GITHUB_REPOSITORY"
          fi
          mkdir -p verify
          gh release download "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --pattern ReleaseStore-v0.8.1-preview.apk --dir verify
          cmp "$apk" verify/ReleaseStore-v0.8.1-preview.apk
          python .github/release/check-preview.py
          gh release edit "$PREVIEW_TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          python .github/release/check-preview.py --published
          echo "APK SHA-256: $sha" >> "$GITHUB_STEP_SUMMARY"
