name: Personal Release Store
on:
  push:
    branches: ['work/phase1-installer', 'work/post-phase1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build preview
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STORE_PREVIEW_KEYSTORE_BASE64 }}
          STORE_SIGNING_PASSWORD: ${{ secrets.STORE_PREVIEW_STORE_PASSWORD }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_PREVIEW_KEY_PASSWORD }}
          STORE_SIGNING_ALIAS: ${{ secrets.STORE_PREVIEW_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64$EXPECTED_CERT" ]]; then
            : "${KEYSTORE_B64:?missing signing key}" "${EXPECTED_CERT:?missing pinned certificate}"
            : "${STORE_SIGNING_PASSWORD:?}" "${STORE_KEY_PASSWORD:?}" "${STORE_SIGNING_ALIAS:?}"
            umask 077
            export STORE_SIGNING_FILE="$RUNNER_TEMP/store-preview.keystore"
            trap 'rm -f "$STORE_SIGNING_FILE"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$STORE_SIGNING_FILE"
          fi
          unset KEYSTORE_B64
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check live GitHub Release responses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://api.github.com/repos
          probe() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          public=$(probe "$base/actions/checkout/releases?per_page=1")
          private=$(probe "$base/$GITHUB_REPOSITORY/releases?per_page=1")
          allowed=$(probe -H "Authorization: Bearer $GH_TOKEN" "$base/$GITHUB_REPOSITORY/releases?per_page=1")
          absent=$(probe -H "Authorization: Bearer $GH_TOKEN" "$base/$GITHUB_REPOSITORY/releases/tags/nonexistent-diagnostic-$GITHUB_SHA")
          echo "public-anonymous=$public repository-anonymous=$private repository-authorized=$allowed missing-tag=$absent"
          test "$allowed" = 200 && test "$absent" = 404
      - name: Verify APK and record build identity
        env:
          EXPECTED_CERT: ${{ vars.STORE_PREVIEW_CERT_SHA256 }}
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature")
          test -n "$cert"
          if [[ -n "$EXPECTED_CERT" ]]; then test "${cert,,}" = "${EXPECTED_CERT,,}"; fi
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" "$RUNNER_TEMP/badging"
          grep -Fx "sdkVersion:'23'" "$RUNNER_TEMP/badging"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$apk" ReleaseStore-preview.apk
          { echo "$GITHUB_SHA"; sha256sum ReleaseStore-preview.apk; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: ReleaseStore-preview.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
  device:
    strategy:
      fail-fast: false
      matrix:
        api: [23, 29]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: bash .github/workflows/device-checks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: seven-rows-api-${{ matrix.api }}
          path: seven-rows.png
          retention-days: 7

  preview:
    needs: [verify, device]
    if: github.ref == 'refs/heads/work/phase1-installer' || github.ref == 'refs/heads/work/post-phase1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ReleaseStore-preview.apk
          path: delivery
          skip-decompress: true
      - name: Verify private Release Asset and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=delivery/ReleaseStore-preview.apk
          tag="store-preview-${GITHUB_SHA:0:12}"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Release Store · ${GITHUB_SHA:0:12}" --notes "Release Store preview. Source: $GITHUB_SHA. SHA-256: $sha"
          fi
          mkdir -p verify
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern 'ReleaseStore-preview.apk' --dir verify
          cmp "$apk" verify/ReleaseStore-preview.apk
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "APK SHA-256: $sha" >> "$GITHUB_STEP_SUMMARY"
