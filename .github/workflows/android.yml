name: Release APK preview
on:
  push:
    branches: ['work/phase1-installer']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK and record build identity
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:)" "$RUNNER_TEMP/badging"
          grep -Fx "sdkVersion:'23'" "$RUNNER_TEMP/badging"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$apk" ReleaseInstaller-debug.apk
          { echo "$GITHUB_SHA"; sha256sum ReleaseInstaller-debug.apk; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: ReleaseInstaller-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
  device:
    strategy:
      fail-fast: false
      matrix:
        api: [23, 29]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: gradle connectedDebugAndroidTest

  preview:
    needs: [verify, device]
    if: github.ref == 'refs/heads/work/phase1-installer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ReleaseInstaller-debug.apk
          path: delivery
          skip-decompress: true
      - name: Verify private Release Asset and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=delivery/ReleaseInstaller-debug.apk
          tag="pr1-preview-${GITHUB_SHA:0:12}"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Release APK Installer · ${GITHUB_SHA:0:12}" --notes "PR #1 debug build. Source: $GITHUB_SHA. SHA-256: $sha"
          fi
          mkdir -p verify
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern 'ReleaseInstaller-debug.apk' --dir verify
          cmp "$apk" verify/ReleaseInstaller-debug.apk
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "APK SHA-256: $sha" >> "$GITHUB_STEP_SUMMARY"
